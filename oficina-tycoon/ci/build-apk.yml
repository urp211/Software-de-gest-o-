name: Build APK

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'oficina-tycoon/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oficina-tycoon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: oficina-tycoon/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: oficina-tycoon/android

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             out/oficina-tycoon-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oficina-tycoon-apk
          path: oficina-tycoon/out/oficina-tycoon-debug.apk
          if-no-files-found: error
