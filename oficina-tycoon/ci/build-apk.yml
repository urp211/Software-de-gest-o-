name: Build APK

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'oficina-tycoon/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oficina-tycoon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: oficina-tycoon/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: oficina-tycoon/android

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             out/oficina-tycoon.apk
          ls -lh out/

      # 1) Artefacto (sempre) — descarregável na página da execução
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oficina-tycoon-apk
          path: oficina-tycoon/out/oficina-tycoon.apk
          if-no-files-found: error

      # 2) Release (link permanente e direto para o telemóvel)
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Oficina Tycoon 3D — APK
          body: |
            APK de teste (debug) do **Oficina Tycoon 3D**.

            Simulação de oficina + condução 3D de camião-reboque
            com câmaras estilo ETS2.

            **Download direto:**
            https://github.com/${{ github.repository }}/releases/download/apk-latest/oficina-tycoon.apk

            Instalação: transfere no Android, permite "instalar de fontes
            desconhecidas" e abre o ficheiro.
          files: oficina-tycoon/out/oficina-tycoon.apk
          prerelease: true
