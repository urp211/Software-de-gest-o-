<html lang="pt-BR">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Truck Simulator" />
    <link rel="manifest" href="/manifest.json" />
    <title>Truck Simulator - 3D Europe Driving Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-black text-white m-0 p-0 overflow-hidden w-screen h-screen select-none font-sans">
    <div id="game-container" class="relative w-full h-full overflow-hidden"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Service Worker registration for 100% Offline gameplay
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('Truck Simulator ServiceWorker registrado:', reg.scope);
          }).catch((err) => {
            console.log('Truck Simulator ServiceWorker erro:', err);
          });
        });
      }
    </script>
  </body>
</html>
